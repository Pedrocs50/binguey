name: keepalive
# Evita a pausa do projeto gratuito do Supabase (7 dias sem atividade) e fecha salas vencidas.
# Obs.: o GitHub desativa workflows agendados após 60 dias sem atividade no repositório.
# A limpeza de clips (Edge Function purge-expired) entra na Fase 3.
on:
  schedule: [{ cron: "17 */12 * * *" }]
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
